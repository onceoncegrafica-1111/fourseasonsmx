<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Four Seasons Hotel Mexico City | Premium Experience Hub</title>
    
    <!-- Tipografía de Alta Costura: Playfair Display (Serif) y Lato (Sans-serif secundaria) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           VARIABLES CORPORATIVAS: FOUR SEASONS
           ========================================= */
        :root {
            --oro-viejo: #C5A880;
            --arena-real: #FDFCFA;
            --verde-follaje: #1E2C22;
            --crema-calido: #F7F4EF;
            --chukum-sutil: #EAE5DC;
            --oliva-palido: #5F6F65;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(197, 168, 128, 0.3);
            --oro-sombra: rgba(197, 168, 128, 0.2);
            --sombra-elegante: rgba(30, 44, 34, 0.08);
        }

        /* =========================================
           HIGIENE Y CONTROL DE RENDIMIENTO
           ========================================= */
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* El fondo ahora es gestionado por la capa dinámica inferior */
            background: transparent;
            font-family: 'Playfair Display', serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            color: var(--verde-follaje);
        }

        /* =========================================
           SISTEMA DE VITALIDAD Y GEOMETRÍA ASÍNCRONA
           ========================================= */
        /* Contenedor Blindado de Fondo */
        .b2b-bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: radial-gradient(circle at 50% 50%, #FDFCFA 0%, #EAE5DC 100%);
            overflow: hidden;
            pointer-events: none;
        }

        /* Base de Figuras Fluidas */
        .shape {
            position: absolute;
            border-radius: 43% 57% 64% 36% / 40% 44% 56% 60%;
            will-change: transform, opacity;
        }

        /* Base de Circunferencias puras */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(197, 168, 128, 0.25);
            background: transparent;
            will-change: transform, opacity;
        }

        /* 1. Figuras Estáticas Base */
        .s-static-dark { 
            width: 450px; height: 450px; background: #5F6F65; opacity: 0.05; top: -10%; left: -5%; 
            animation: subtleBreathe 26s infinite alternate ease-in-out -7s;
        }
        .s-static-light { 
            width: 600px; height: 600px; background: #F4F0E6; opacity: 0.6; bottom: -15%; right: -10%; 
            animation: subtleBreathe 32s infinite alternate ease-in-out -2s;
        }

        /* 2. Figura Grande - Movimiento MUY LENTO (45s) */
        .s-float-large {
            width: 550px; height: 550px; background: #C5A880; opacity: 0.04; top: 35%; right: -10%;
            animation: organicFloatAlpha 45s infinite alternate cubic-bezier(0.4, 0, 0.2, 1) -15s;
        }

        /* 3. Figura Mediana - Movimiento MEDIO (18s) */
        .s-float-medium {
            width: 320px; height: 300px; background: #A3B19B; opacity: 0.04; bottom: 15%; left: -5%;
            animation: organicFloatBeta 18s infinite alternate cubic-bezier(0.25, 0.1, 0.25, 1) -5s;
        }

        /* 4. Nueva Figura de Contraste Profundo - Movimiento NORMAL Y RÁPIDO (11s) */
        .s-deep-contrast {
            width: 280px; height: 290px; background: #8C7A6B; opacity: 0.035; top: 15%; left: 40%;
            animation: organicFloatGamma 11s infinite alternate cubic-bezier(0.42, 0, 0.58, 1) -3s;
        }

        /* 5. Nueva Figura Transparente - Movimiento MEDIO DIFERENTE (24s) */
        .s-light-flash {
            width: 400px; height: 400px; background: #FFFFFF; opacity: 0.25; bottom: 30%; right: 30%;
            animation: organicFloatDelta 24s infinite alternate ease-in-out -12s;
        }

        /* 6. Figura con Difuminado Ultra-Profundo (55s) */
        .s-blur-deep { 
            width: 700px; height: 700px; background: #D9CBB6; opacity: 0.08; top: 10%; left: 25%; filter: blur(80px); 
            animation: organicFloatAlpha 55s infinite alternate ease-in-out -20s;
        }

        /* 7. Circunferencia Mayor Irregular - LENTO (38s) */
        .ring.r-slow {
            width: 500px; height: 500px; top: -5%; right: 15%;
            animation: ringAnimateAlpha 38s infinite linear -9s;
        }

        /* 8. Circunferencia Menor Desplazada - MEDIO/RÁPIDO (14s) */
        .ring.r-medium {
            width: 300px; height: 300px; bottom: 10%; left: 20%;
            border: 1.5px dashed rgba(95, 111, 101, 0.2);
            animation: ringAnimateBeta 14s infinite linear -4s;
        }

        /* --- MOTORES DE ANIMACIÓN: TRAYECTORIAS --- */
        @keyframes organicFloatAlpha {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(-5vw, 4vh) rotate(8deg) scale(1.05); }
            66% { transform: translate(3vw, -6vh) rotate(-5deg) scale(0.95); }
            100% { transform: translate(-2vw, -2vh) rotate(12deg) scale(1.08); }
        }

        @keyframes organicFloatBeta {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(6vw, -8vh) scale(0.9) rotate(-15deg); }
            100% { transform: translate(-4vw, -2vh) scale(1.1) rotate(5deg); }
        }

        @keyframes organicFloatGamma {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(3vw, 5vh) rotate(10deg) scale(1.05); }
            50% { transform: translate(-4vw, 2vh) rotate(-15deg) scale(0.98); }
            75% { transform: translate(2vw, -5vh) rotate(5deg) scale(1.1); }
            100% { transform: translate(-3vw, 3vh) rotate(-8deg) scale(1.02); }
        }

        @keyframes organicFloatDelta {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(-7vw, 6vh) scale(1.15) rotate(20deg); }
            100% { transform: translate(5vw, 4vh) scale(0.85) rotate(-10deg); }
        }

        @keyframes ringAnimateAlpha {
            0% { transform: rotate(0deg) translate(0, 0) scale(1); }
            33% { transform: rotate(120deg) translate(2vw, -2vh) scale(1.03); }
            66% { transform: rotate(240deg) translate(-2vw, 2vh) scale(0.97); }
            100% { transform: rotate(360deg) translate(0, 0) scale(1); }
        }

        @keyframes ringAnimateBeta {
            0% { transform: rotate(360deg) translate(0, 0); }
            50% { transform: rotate(180deg) translate(25px, -20px) scale(1.08); }
            100% { transform: rotate(0deg) translate(0, 0); }
        }

        @keyframes subtleBreathe {
            0% { transform: scale(1) translate(0,0); }
            100% { transform: scale(1.03) translate(1vw, 1vh); }
        }

        /* =========================================
           CONTENEDOR PRINCIPAL Y COMPONENTES
           ========================================= */
        .luxury-hub {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 480px;
            padding: 40px 0 20px 0;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .fs-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .fs-tree-logo {
            width: 55px;
            height: auto;
            fill: var(--verde-follaje);
        }

        .fs-header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--verde-follaje);
            line-height: 1.2;
        }

        .fs-header p {
            font-family: 'Lato', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--oro-viejo);
            font-weight: 400;
        }

        .mosaic-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px 20px;
            text-decoration: none;
            color: var(--verde-follaje);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 8px 20px var(--sombra-elegante);
            position: relative;
            overflow: hidden;
        }

        .span-2 { grid-column: span 2; }
        .span-1 { grid-column: span 1; padding: 28px 15px; }

        .card svg {
            width: 28px;
            height: 28px;
            margin-bottom: 12px;
            stroke: var(--oro-viejo);
            stroke-width: 1.2;
            fill: none;
            transition: stroke 0.5s ease;
        }

        .card h2 {
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.3;
            letter-spacing: 0.5px;
        }

        .card-subtitle {
            font-family: 'Lato', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--oro-viejo);
            margin-top: 6px;
            opacity: 0.8;
        }

        .card:hover, .card:active {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px var(--oro-sombra);
            background: rgba(255, 255, 255, 0.95);
            border-color: var(--oro-viejo);
        }

        .card:hover h2 {
            color: var(--oro-viejo);
        }

        .card:hover svg {
            stroke: var(--verde-follaje);
        }

        .fs-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 30px;
            z-index: 10;
        }

        .social-link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 15px var(--sombra-elegante);
        }

        .social-link svg {
            width: 20px;
            height: 20px;
            stroke: var(--oro-viejo);
            stroke-width: 1.5;
            fill: none;
            transition: stroke 0.4s ease;
        }

        .social-link:hover, .social-link:active {
            transform: translateY(-3px);
            border-color: var(--oro-viejo);
            box-shadow: 0 8px 20px var(--oro-sombra);
            background: rgba(255, 255, 255, 0.95);
        }

        .social-link:hover svg {
            stroke: var(--verde-follaje);
        }

        /* =========================================
           ESCALADO QUIRÚRGICO RESPONSIVO (MÓVILES)
           ========================================= */
        @media (max-width: 640px) {
            .luxury-hub {
                width: 84%; /* Respira un 8% por cada lado de la pantalla */
                max-width: 340px; /* Límite estricto de bloque para móviles */
                gap: 25px; /* Acerca sutilmente el header a las tarjetas */
                padding: 30px 0 20px 0;
            }

            .fs-header h1 {
                font-size: 1.4rem; /* Escala proporcional para móvil */
            }

            .fs-tree-logo {
                width: 48px;
            }

            .mosaic-grid {
                gap: 12px; /* Espacio interno más refinado */
            }

            .card {
                padding: 16px 15px; /* Tarjetas más esbeltas */
            }

            .span-1 { 
                padding: 20px 12px; /* Proporción para cuadrícula de mitad */
            }

            .card svg {
                width: 24px;
                height: 24px;
                margin-bottom: 8px; /* Icono ajustado sin devorar aire */
            }

            .card h2 {
                font-size: 0.95rem; /* Lectura impecable sin llenar todo el botón */
            }

            .card-subtitle {
                font-size: 0.55rem; /* Letra ultra-delicada para detalles */
                letter-spacing: 1px;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- HUB DE EXPERIENCIA (INTACTO) -->
    <main class="luxury-hub">
        
        <header class="fs-header">
            <svg class="fs-tree-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50,15 C45,15 40,25 40,35 C40,45 48,50 48,60 L48,85 L52,85 L52,60 C52,50 60,45 60,35 C60,25 55,15 50,15 Z M50,20 C53,20 56,28 56,35 C56,42 51,46 51,55 L49,55 C49,46 44,42 44,35 C44,28 47,20 50,20 Z" />
                <circle cx="35" cy="40" r="4" />
                <circle cx="65" cy="40" r="4" />
                <circle cx="50" cy="25" r="4" />
                <circle cx="42" cy="50" r="3" />
                <circle cx="58" cy="50" r="3" />
            </svg>
            <div>
                <h1>Four Seasons</h1>
                <p>Hotel Mexico City</p>
            </div>
        </header>

        <section class="mosaic-grid">
            
            <a href="https://www.fourseasons.com/mexico/offers/" class="card span-2" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24">
                    <path d="M21 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <h2>Reservas de Lujo</h2>
                <span class="card-subtitle">Planifique su Estadía</span>
            </a>

            <a href="https://www.fourseasons.com/mexico/accommodations/" class="card span-1" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24">
                    <path d="M3 21v-8m18 8v-8M3 13h18M3 13V8a2 2 0 012-2h14a2 2 0 012 2v5m-11 0v3m8-3v3" />
                </svg>
                <h2>Habitaciones<br>& Suites</h2>
            </a>

            <a href="https://www.fourseasons.com/mexico/dining/" class="card span-1" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24">
                    <path d="M8 21h8M12 17v4M7 4h10l-1 13H8L7 4z" />
                    <path d="M12 4v4" />
                </svg>
                <h2>Zanaya &<br>Fifty Mils</h2>
            </a>

            <!-- SECCIÓN MAGAZINE INTACTA -->
            <a href="https://www.fourseasons.com/magazine/" class="card span-2" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                </svg>
                <h2>Magazine Four Seasons</h2>
                <span class="card-subtitle">Colección México</span>
            </a>

        </section>
    </main>

    <footer class="fs-footer">
        <a href="https://www.instagram.com/fsmexico/" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Instagram Oficial Four Seasons Mexico City">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37zM17.5 6.5h.01"></path>
            </svg>
        </a>
    </footer>

    <!-- Sistema de Vitalidad y Geometría Asíncrona - Four Seasons Master -->
    <div class="b2b-bg-canvas">
        <div class="shape s-static-dark"></div>
        <div class="shape s-static-light"></div>
        <div class="shape s-float-large"></div>
        <div class="shape s-float-medium"></div>
        <div class="shape s-blur-deep"></div>
        <!-- Nuevas Circunferencias y Variaciones de Contraste -->
        <div class="ring r-slow"></div>
        <div class="ring r-medium"></div>
        <div class="shape s-deep-contrast"></div>
        <div class="shape s-light-flash"></div>
    </div>

</body>
</html>
